<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #102a43, #1769aa); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .card { background: white; color: #172033; max-width: 560px; padding: 38px 26px; border-radius: 22px; box-shadow: 0 18px 45px rgba(0,0,0,.25); }
    .check { width: 76px; height: 76px; background: #ffb703; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 20px; }
    h1 { font-size: 34px; margin-bottom: 12px; color: #102a43; }
    p { color: #52606d; font-size: 17px; margin-bottom: 22px; }
    a { display: inline-block; background: #ffb703; color: #172033; padding: 13px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    .small { margin-top: 18px; font-size: 14px; color: #7b8794; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Thank You!</h1>
    <p>Your moving quote request has been submitted successfully. Our team will contact you shortly.</p>
    <a href="index.html">Back to Home</a>
    <div class="small">For urgent moving support, call: +91 99999 99999</div>
  </div>
</body>
</html>
